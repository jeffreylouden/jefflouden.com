  <style>
    /* Shared styles live in site.css. These are the home page's own. */
    /* Brand underlines: each organization's own color. */
    [data-brand="atlantic"] { --b: #e7131a; }
    [data-brand="existential"] { --b: #59c2cf; }
    [data-brand="time"] { --b: #e90606; }
    [data-brand="lyft"] { --b: #ff00bf; }
    [data-brand="nest"] { --b: #00afd8; }
    [data-brand="linkedin"] { --b: #0a66c2; }
    [data-brand="ink"] { --b: var(--ink); }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) [data-brand="linkedin"] { --b: #3480cc; }
    }

    :root[data-theme="dark"] [data-brand="linkedin"] { --b: #3480cc; }

    a[data-brand="google"] {
      text-decoration: none;
      padding-bottom: 3px;
      background: linear-gradient(90deg,
        color-mix(in srgb, #4285f4 var(--ua), transparent) 0 25%,
        color-mix(in srgb, #ea4335 var(--ua), transparent) 25% 50%,
        color-mix(in srgb, #fbbc05 var(--ua), transparent) 50% 75%,
        color-mix(in srgb, #34a853 var(--ua), transparent) 75%) no-repeat left bottom / 100% 1px;
    }

    .role-line {
      color: var(--muted);
    }

    h2 {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .rows {
      display: grid;
      gap: 32px;
    }

    .row {
      display: grid;
      grid-template-columns: 9.5rem 1fr;
      gap: 4px 24px;
      align-items: baseline;
    }

    .years {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .org {
      font-size: 16px;
      font-weight: 500;
    }

    .title {
      color: var(--muted);
    }

    .title + .title {
      margin-top: 2px;
    }

    /* Aureo lockup, recreated from aureo.audio: waveform mark plus the Outfit Bold wordmark as a path. */
    .built {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0 0.4em;
    }

    .aureo {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--ink);
      text-decoration: none;
      border-radius: 3px;
    }

    /* A soft shadow lifts the mark off the paper; on the dark ground it has nothing to do. */
    .aureo {
      filter: drop-shadow(0 1px 1.5px rgb(22 22 22 / 0.22));
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .aureo { filter: none; }
    }

    :root[data-theme="dark"] .aureo { filter: none; }

    .aureo-bars {
      width: 18px;
      height: 18px;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      overflow: visible;
    }

    .aureo-bars path:nth-child(1) { stroke: var(--aureo-1); }
    .aureo-bars path:nth-child(2),
    .aureo-bars path:nth-child(6) { stroke: var(--aureo-2); }
    .aureo-bars path:nth-child(3) { stroke: var(--aureo-3); }
    .aureo-bars path:nth-child(4) { stroke: var(--aureo-4); }
    .aureo-bars path:nth-child(5) { stroke: var(--aureo-5); }

    .aureo-word {
      height: 11px;
      width: auto;
      fill: currentColor;
    }

    .row ul li {
      line-height: 1.6;
    }

    address {
      font-style: normal;
    }

    .contact {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 28px;
    }

    /* The light and dark toggle, in the top-right corner of the page: an ink ring, half filled, that turns over between the modes.
       Without JavaScript it stays hidden. */
    #theme {
      position: absolute;
      top: clamp(16px, 2.5vw, 24px);
      right: clamp(16px, 2.5vw, 24px);
      display: inline-flex;
      background: none;
      border: 0;
      padding: 0;
      color: var(--ink);
      cursor: pointer;
      opacity: 0.8;
      transition: opacity 0.2s;
      z-index: 2;
      view-transition-name: theme-toggle;
    }

    /* Dark mode is lit by a flashlight: a soft pool of light follows the pointer and the edges of the page fall into shadow.
       On touch screens and with reduced motion it stays put. Light mode, print and no-JS never see it. */
    .flashlight {
      --x: 50%;
      --y: 40%;
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(circle 340px at var(--x) var(--y), rgb(255 236 200 / 0.05) 0, rgb(0 0 0 / 0) 35%, rgb(0 0 0 / 0.18) 55%, rgb(0 0 0 / 0.42) 78%, rgb(0 0 0 / 0.6) 100%);
      opacity: 0;
      transition: opacity 0.6s;
    }

    .flashlight[hidden] {
      display: none;
    }

    /* On a Friday the 13th the light flickers once as the page opens. */
    @keyframes flicker {
      0%, 100% { opacity: 1; }
      8% { opacity: 0.15; }
      14% { opacity: 1; }
      22% { opacity: 0.3; }
      27% { opacity: 1; }
    }

    :root[data-spooky="friday13"] .flashlight {
      animation: flicker 1.4s 0.4s 1 both;
    }

    @media (prefers-reduced-motion: reduce) {
      :root[data-spooky="friday13"] .flashlight { animation: none; }
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .flashlight { opacity: 1; }
    }

    :root[data-theme="dark"] .flashlight { opacity: 1; }

    /* On a holiday, or in the run-up to the few that earn one, a small mark sits beside the toggle. The script below works the dates out from rules, so nothing needs touching each year. A few link out.
       On an Arsenal match day it is a gothic A instead, linked to The Athletic's schedule. Without JavaScript, and in print, it stays hidden. */
    #holiday {
      position: absolute;
      top: calc(clamp(16px, 2.5vw, 24px) - 2px);
      right: calc(clamp(16px, 2.5vw, 24px) + 30px);
      display: inline-flex;
      color: var(--ink);
      opacity: 0.8;
      transition: opacity 0.2s;
      z-index: 2;
    }

    #holiday[hidden] {
      display: none;
    }

    a#holiday:hover,
    a#holiday:focus-visible {
      opacity: 1;
    }

    a#holiday:focus-visible {
      outline: 2px solid var(--blood);
      outline-offset: 3px;
      border-radius: 2px;
    }


    #holiday svg {
      display: block;
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #holiday .solid { fill: currentColor; stroke: none; }
    #holiday .accent { fill: var(--blood); stroke: none; }
    #holiday .accent-line { stroke: var(--blood); }
    #holiday .leaf-line { stroke: var(--aureo-1); }
    #holiday .sea-line { stroke: var(--aureo-4); }
    #holiday .knock { fill: var(--paper); }
    #holiday .curl { stroke-width: 1.1; }
    #holiday .crater { fill: var(--paper); stroke: none; opacity: 0.28; }

    #theme[hidden] {
      display: none;
    }

    #theme:hover,
    #theme:focus-visible {
      opacity: 1;
    }

    #theme:focus-visible {
      outline: 2px solid var(--blood);
      outline-offset: 3px;
      border-radius: 50%;
    }

    /* Switching modes cross-fades the page on the icon's timing; the icon itself stays out of
       the fade and animates live on top. */
    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation-duration: 0.6s;
      animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1);
    }

    ::view-transition-old(theme-toggle) {
      display: none;
    }

    ::view-transition-new(theme-toggle) {
      animation: none;
    }

    #theme svg {
      display: block;
      width: 14px;
      height: 14px;
    }

    #theme .half {
      transform-box: view-box;
      transform-origin: 8px 8px;
      transition: transform 0.6s cubic-bezier(0.65, 0, 0.35, 1);
    }

    #theme[data-mode="dark"] .half {
      transform: rotate(180deg);
    }

    @media (max-width: 560px) {
      .row {
        grid-template-columns: 1fr;
      }

      .years {
        order: -1;
        font-size: 13px;
      }
    }

    /* Clicking the email copies it, and says so quietly beside it. */
    .copied {
      margin-left: 8px;
      color: var(--muted);
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .copied.on {
      opacity: 1;
    }

    /* Keyboard shortcuts, listed by pressing ? (t, r, e). Without JavaScript the list never opens. */
    #keys {
      border: 1px solid var(--rule);
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
      padding: 20px 24px;
      min-width: 220px;
      font: inherit;
    }

    #keys:focus,
    #keys:focus-visible {
      outline: none;
    }

    #keys::backdrop {
      background: rgb(0 0 0 / 0.3);
    }

    #keys h2 {
      margin: 0 0 14px;
    }

    #keys dl {
      display: grid;
      gap: 10px;
      margin: 0;
    }

    #keys dl div {
      display: flex;
      gap: 14px;
      align-items: baseline;
    }

    #keys dt {
      width: 1.75em;
    }

    #keys dd {
      margin: 0;
      color: var(--muted);
    }

    kbd {
      display: inline-block;
      min-width: 1.6em;
      padding: 3px 6px;
      border: 1px solid var(--rule);
      border-bottom-width: 2px;
      border-radius: 4px;
      font: 500 12px/1 var(--sans);
      text-align: center;
      color: var(--ink);
    }

    .print-note {
      display: none;
    }

    /* Print without the toggle, and point to the résumé. site.css makes it light. */
    @media print {
      .print-note {
        display: block;
        color: var(--muted);
      }

      :root:not(#print) [data-brand="linkedin"] {
        --b: #0a66c2;
      }

      #theme,
      #holiday,
      .flashlight {
        display: none;
      }

      .aureo {
        filter: none;
      }
    }
  </style>
</head>

        // A gothic A, the capital A of UnifrakturCook Bold (SIL Open Font License) drawn as a path, with its flag and foot curled.
        arsenal: '<path class="accent" d="M11.9 4.9Q10.8 4.7 9.7 4.7Q7.1 4.7 4.9 6.4Q5 6.3 4.9 5.9Q4.8 5.4 4.8 5.3Q7.7 2.9 11.2 1.5Q15.7 2.8 19.5 5.2Q19.2 5.6 18.9 5.9Q18.5 6.2 18.2 6.6Q18.2 6.8 18.2 7.2V7.8L18.2 13.8Q18.3 14.5 18.5 14.7L19.6 15.6L17.7 18.3L15.1 16.1Q15.4 14.4 15.4 11.5H11.2Q10.8 15.5 8.8 18.2Q6.8 21 5.2 22.5Q4.7 22.2 4.4 21.9Q5.7 20.6 6.3 18.9Q6.9 17.1 7.4 15.2Q7.8 13.2 7.8 11.4Q7.8 9.5 7 7.9Q9.7 6.6 11.9 4.9ZM15.3 8.9Q15.3 7.6 15.3 7.3Q15.3 7 15.3 6.6Q14.2 5.8 13 5.3Q12.2 5.9 11.8 6.6Q11.4 7.4 11.3 8.9Z"/>' +
          '<path class="accent-line curl" d="M4.95 5.8C3.6 6.8 3.5 8.6 4.8 9"/><circle class="accent" cx="5.3" cy="8.7" r=".85"/>' +
          '<path class="accent-line curl" d="M4.9 22.2C3.1 21.6 2.6 19.7 3.8 19"/><circle class="accent" cx="4.3" cy="19.3" r=".85"/>'
      };
      // Arsenal's matches, from src/arsenal.json: kickoff (UTC), opponent, home, competition.
      var matches = (
        {{matches}}
      );
      function fixed(m, d) { return function (y) { return new Date(y, m - 1, d); }; }
      function nth(m, wd, n) { return function (y) { var first = new Date(y, m - 1, 1).getDay(); return new Date(y, m - 1, 1 + (wd - first + 7) % 7 + (n - 1) * 7); }; }
      function last(m, wd) { return function (y) { var end = new Date(y, m, 0); return new Date(y, m - 1, end.getDate() - (end.getDay() - wd + 7) % 7); }; }
      // Election Day is the Tuesday after the first Monday in November: the first Tuesday from November 2.
      function election(y) { var d = new Date(y, 10, 2); return new Date(y, 10, 2 + (2 - d.getDay() + 7) % 7); }
      var marks = [
        { id: 'newyear', name: 'New Year’s Day', date: fixed(1, 1), lead: 1, url: 'https://en.wikipedia.org/wiki/New_Year%27s_Day' },
        { id: 'valentine', name: 'Valentine’s Day', date: fixed(2, 14), lead: 0, url: 'https://en.wikipedia.org/wiki/Valentine%27s_Day' },
        { id: 'presidents', name: 'Presidents’ Day', date: nth(2, 1, 3), lead: 0, url: 'https://en.wikipedia.org/wiki/Presidents%27_Day' },
        { id: 'pi', name: 'Pi Day', date: fixed(3, 14), lead: 0, url: 'https://en.wikipedia.org/wiki/Pi_Day' },
        { id: 'patrick', name: 'St. Patrick’s Day', date: fixed(3, 17), lead: 0, url: 'https://en.wikipedia.org/wiki/Saint_Patrick%27s_Day' },
        { id: 'earth', name: 'Earth Day', date: fixed(4, 22), lead: 0, url: 'https://en.wikipedia.org/wiki/Earth_Day' },
        { id: 'memorial', name: 'Memorial Day', date: last(5, 1), lead: 0, url: 'https://en.wikipedia.org/wiki/Memorial_Day' },
        { id: 'juneteenth', name: 'Juneteenth', date: fixed(6, 19), lead: 0, url: 'https://en.wikipedia.org/wiki/Juneteenth' },
        { id: 'july4', name: 'Independence Day', date: fixed(7, 4), lead: 1, url: 'https://en.wikipedia.org/wiki/Independence_Day_(United_States)' },
        { id: 'labor', name: 'Labor Day', date: nth(9, 1, 1), lead: 0, url: 'https://en.wikipedia.org/wiki/Labor_Day_(United_States)' },
        { id: 'halloween', name: 'Halloween', date: fixed(10, 31), lead: 6, url: 'https://en.wikipedia.org/wiki/Halloween' },
        { id: 'election', name: 'Election Day', date: election, lead: 7, url: 'https://vote.gov', cta: 'Find your polling place at vote.gov' },
        { id: 'veterans', name: 'Veterans Day', date: fixed(11, 11), lead: 0, url: 'https://en.wikipedia.org/wiki/Veterans_Day' },
        { id: 'thanksgiving', name: 'Thanksgiving', date: nth(11, 4, 4), lead: 0, url: 'https://en.wikipedia.org/wiki/Thanksgiving_(United_States)' },
        { id: 'friday13', name: 'Friday the 13th', on: function (d) { return d.getDay() === 5 && d.getDate() === 13; }, url: 'https://en.wikipedia.org/wiki/Friday_the_13th' },
        { id: 'programmers', name: 'Programmers’ Day', date: function (y) { return new Date(y, 0, 256); }, lead: 0, url: 'https://en.wikipedia.org/wiki/Programmer%27s_Day' },
        { id: 'holidays', name: 'Happy holidays', date: fixed(12, 30), lead: 10, url: 'https://en.wikipedia.org/wiki/Christmas_and_holiday_season', always: 'Happy holidays' }
      ];
      var now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      var hit, i, j, d, until;
      for (i = 0; i < marks.length && !hit; i++) {
        if (marks[i].on) { if (marks[i].on(today)) { hit = marks[i]; until = 0; } continue; }
        for (j = 0; j < 2 && !hit; j++) { // the second year catches New Year’s Eve
          d = marks[i].date(today.getFullYear() + j);
          until = Math.round((d - today) / 864e5);
          if (until >= 0 && until <= marks[i].lead) hit = marks[i];
        }
      }
      var game, k;
      for (i = 0; i < matches.length && !game; i++) {
        k = new Date(matches[i][0]);
        if (k.getFullYear() === today.getFullYear() && k.getMonth() === today.getMonth() && k.getDate() === today.getDate()) game = matches[i];
      }
      if (game && !(hit && until === 0)) {
        hit = {
          id: 'arsenal', url: 'https://www.nytimes.com/athletic/football/team/arsenal/schedule/',
          always: (game[2] ? 'Arsenal v ' + game[1] : game[1] + ' v Arsenal') + ' today at ' +
            k.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) + ', ' + game[3]
        };
      }
      // A full moon (worked out before paint, see the spooky days) takes the corner only when nothing else wants it.
      if (!hit && document.documentElement.dataset.spooky === 'moon') {
        hit = { id: 'moon', always: 'Full moon tonight', url: 'https://en.wikipedia.org/wiki/Full_moon' };
      }
      if (!hit) return;
      var label = hit.always || hit.name + (until === 0 ? ' is today' : until === 1 ? ' is tomorrow' : ' is in ' + until + ' days');
      if (hit.cta) label += '. ' + hit.cta;
      mark.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + icon[hit.id] + '</svg>';
      mark.title = label;
      mark.setAttribute('aria-label', label);
      if (hit.url) { mark.href = hit.url; mark.rel = 'noopener'; } else { mark.setAttribute('role', 'img'); }
      mark.hidden = false;
    })();

    // The email copies on a plain click (a modified click, or no clipboard, still opens the mail app), the résumé
    // starts loading when a pointer or focus reaches its link, and a few keys do the obvious: t for light or dark,
    // r for the résumé, e to copy the email, ? to list them.
    (function () {
      var root = document.documentElement;
      var email = document.querySelector('.u-email');
      var note = email.nextElementSibling;
      var keys = document.getElementById('keys');
      var timer;
      function copy(fallback) {
        if (!navigator.clipboard || !window.isSecureContext) return false;
        navigator.clipboard.writeText(email.textContent).then(function () {
          note.textContent = 'Copied';
          note.classList.add('on');
          clearTimeout(timer);
          timer = setTimeout(function () { note.classList.remove('on'); }, 1600);
        }, fallback || function () {});
        return true;
      }
      email.addEventListener('click', function (e) {
        if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        if (copy(function () { location.href = email.href; })) e.preventDefault();
      });
      var resume = document.getElementById('resume'), fetched = false;
      function prefetch() {
        if (fetched) return;
        fetched = true;
        var link = document.createElement('link');
        link.rel = 'prefetch';
        link.href = 'resume.pdf';
        document.head.appendChild(link);
      }
      resume.addEventListener('pointerenter', prefetch);
      resume.addEventListener('focus', prefetch);
      if (root.dataset.spooky) document.getElementById('keys-theme').textContent = 'Light or dark (not tonight)';
      keys.addEventListener('click', function (e) { if (e.target === keys) keys.close(); });
      document.addEventListener('keydown', function (e) {
        if (e.metaKey || e.ctrlKey || e.altKey || e.defaultPrevented || e.repeat) return;
        var tag = e.target && e.target.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (e.target && e.target.isContentEditable)) return;
        var theme = document.getElementById('theme');
        if (e.key === '?') {
          e.preventDefault();
          if (keys.open) keys.close(); else keys.showModal();
          return;
        }
        if (keys.open && e.key !== 'Escape') keys.close();
        if (e.key === 't' && !theme.hidden) theme.click();
        else if (e.key === 'r') window.open('resume.pdf', '_blank', 'noopener');
        else if (e.key === 'e') copy();
      });
    })();

    // Printing from the keyboard opens the résumé, the printable version of this page.
    // Printing from the browser's menu still prints the page, pointing to the résumé.
    document.addEventListener('keydown', function (e) {
      if ((e.metaKey || e.ctrlKey) && !e.altKey && !e.shiftKey && e.key.toLowerCase() === 'p') {
        e.preventDefault();
        window.open('resume.pdf', '_blank', 'noopener');
      }
    });

        // For whoever opens the console: the name (drawn after Instrument Sans), a whisper, and where things live.
    console.log('%c' + [
      "   █       ▄▀  ▄▀                   █                 █",
      "   █  ▄▄  ▄█▄ ▄█▄ ▄ ▄  ▄▄  ▄   ▄    █     ▄▄  ▄  ▄  ▄▄█  ▄▄  ▄▄▄",
      "   █ █  █  █   █  █▀  █  █ █   █    █    █  █ █  █ █  █ █  █ █  █",
      "█  █ █▀▀▀  █   █  █   █▀▀▀  █ █     █    █  █ █  █ █  █ █▀▀▀ █  █",
      "▀▄▄▀ ▀▄▄▀  █   █  █   ▀▄▄▀   █      █▄▄▄ ▀▄▄▀ ▀▄▄█ ▀▄▄█ ▀▄▄▀ █  █",
      "                            ▄▀",
      ""
    ].join('\n') + '%cWe traced the call. It’s coming from inside the DevTools.%c' + [
      "",
      "  source    https://github.com/jeffreylouden/jefflouden.com",
      "  terminal  curl https://jefflouden.com",
      "  markdown  curl -H \"Accept: text/markdown\" https://jefflouden.com/",
      "  llms.txt  https://jefflouden.com/llms.txt",
      "  résumé    https://jefflouden.com/resume.pdf",
      "  keys      press ? on the page",
      "  email     {{email}}"
    ].join('\n'),
      'font: 12px ui-monospace, Menlo, Consolas, monospace; color: #6b6b6b',
      'font: italic 14px Georgia, serif; color: #8c1c24',
      'font: 12px ui-monospace, Menlo, Consolas, monospace; color: #6b6b6b');
  </script>
