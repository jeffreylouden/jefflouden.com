  <style>
    /* Shared styles live in site.css. These are the home page's own. */
    /* Brand underlines: each organization's own color. */
    [data-brand="atlantic"] { --b: #e7131a; }
    [data-brand="existential"] { --b: #59c2cf; }
    [data-brand="time"] { --b: #e90606; }
    [data-brand="lyft"] { --b: #ff00bf; }
    [data-brand="nest"] { --b: #00afd8; }
    [data-brand="linkedin"] { --b: #0a66c2; }
    [data-brand="ink"] { --b: var(--ink); }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) [data-brand="linkedin"] { --b: #3480cc; }
    }

    :root[data-theme="dark"] [data-brand="linkedin"] { --b: #3480cc; }

    a[data-brand="google"] {
      text-decoration: none;
      padding-bottom: 3px;
      background: linear-gradient(90deg,
        color-mix(in srgb, #4285f4 var(--ua), transparent) 0 25%,
        color-mix(in srgb, #ea4335 var(--ua), transparent) 25% 50%,
        color-mix(in srgb, #fbbc05 var(--ua), transparent) 50% 75%,
        color-mix(in srgb, #34a853 var(--ua), transparent) 75%) no-repeat left bottom / 100% 1px;
    }

    .role-line {
      color: var(--muted);
    }

    h2 {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .rows {
      display: grid;
      gap: 32px;
    }

    .row {
      display: grid;
      grid-template-columns: 9.5rem 1fr;
      gap: 4px 24px;
      align-items: baseline;
    }

    .years {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .org {
      font-size: 16px;
      font-weight: 500;
    }

    .title {
      color: var(--muted);
    }

    .title + .title {
      margin-top: 2px;
    }

    /* Aureo lockup, recreated from aureo.audio: waveform mark plus the Outfit Bold wordmark as a path. */
    .built {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0 0.4em;
    }

    .aureo {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--ink);
      text-decoration: none;
      border-radius: 3px;
    }

    /* A soft shadow lifts the mark off the paper; on the dark ground it has nothing to do. */
    .aureo {
      filter: drop-shadow(0 1px 1.5px rgb(22 22 22 / 0.22));
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .aureo { filter: none; }
    }

    :root[data-theme="dark"] .aureo { filter: none; }

    .aureo-bars {
      width: 18px;
      height: 18px;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      overflow: visible;
    }

    .aureo-bars path:nth-child(1) { stroke: var(--aureo-1); }
    .aureo-bars path:nth-child(2),
    .aureo-bars path:nth-child(6) { stroke: var(--aureo-2); }
    .aureo-bars path:nth-child(3) { stroke: var(--aureo-3); }
    .aureo-bars path:nth-child(4) { stroke: var(--aureo-4); }
    .aureo-bars path:nth-child(5) { stroke: var(--aureo-5); }

    .aureo-word {
      height: 11px;
      width: auto;
      fill: currentColor;
    }

    .row ul li {
      line-height: 1.6;
    }

    address {
      font-style: normal;
    }

    .contact {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 28px;
    }

    /* The light and dark toggle, in the top-right corner of the page: an ink ring, half filled, that turns over between the modes.
       Without JavaScript it stays hidden. */
    #theme {
      position: absolute;
      top: clamp(16px, 2.5vw, 24px);
      right: clamp(16px, 2.5vw, 24px);
      display: inline-flex;
      background: none;
      border: 0;
      padding: 0;
      color: var(--ink);
      cursor: pointer;
      opacity: 0.8;
      transition: opacity 0.2s;
      z-index: 2;
      view-transition-name: theme-toggle;
    }

    /* In dark mode a button beside the toggle turns on a flashlight: a soft pool of light follows the pointer and the edges of
       the page fall into shadow. On touch screens and with reduced motion it stays put. It starts off, the choice is saved in
       localStorage (flashlight), and light mode, print and no-JS never see the button or the light. */
    .flashlight {
      --x: 50%;
      --y: 40%;
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(circle 440px at var(--x) var(--y), rgb(0 0 0 / 0) 40%, rgb(0 0 0 / 0.06) 60%, rgb(0 0 0 / 0.16) 80%, rgb(0 0 0 / 0.28) 100%);
      opacity: 0;
      transition: opacity 0.6s;
    }

    .flashlight[hidden] {
      display: none;
    }

    #flashlight {
      position: absolute;
      top: clamp(16px, 2.5vw, 24px);
      right: calc(clamp(16px, 2.5vw, 24px) + 30px);
      display: none;
      background: none;
      border: 0;
      padding: 0;
      color: var(--ink);
      cursor: pointer;
      opacity: 0.8;
      transition: opacity 0.2s;
      z-index: 2;
    }

    #flashlight:hover,
    #flashlight:focus-visible {
      opacity: 1;
    }

    #flashlight:focus-visible {
      outline: 2px solid var(--blood);
      outline-offset: 3px;
      border-radius: 2px;
    }

    #flashlight svg {
      display: block;
      width: 14px;
      height: 14px;
    }

    #flashlight .lens {
      transition: fill 0.3s;
    }

    #flashlight[aria-pressed="true"] .lens {
      fill: currentColor;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) #flashlight:not([hidden]) { display: inline-flex; }
      :root:not([data-theme="light"])[data-flashlight] .flashlight { opacity: 1; }
    }

    :root[data-theme="dark"] #flashlight:not([hidden]) { display: inline-flex; }
    :root[data-theme="dark"][data-flashlight] .flashlight { opacity: 1; }

    #theme[hidden] {
      display: none;
    }

    #theme:hover,
    #theme:focus-visible {
      opacity: 1;
    }

    #theme:focus-visible {
      outline: 2px solid var(--blood);
      outline-offset: 3px;
      border-radius: 50%;
    }

    /* Switching modes cross-fades the page on the icon's timing; the icon itself stays out of
       the fade and animates live on top. */
    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation-duration: 0.6s;
      animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1);
    }

    ::view-transition-old(theme-toggle) {
      display: none;
    }

    ::view-transition-new(theme-toggle) {
      animation: none;
    }

    #theme svg {
      display: block;
      width: 14px;
      height: 14px;
    }

    #theme .half {
      transform-box: view-box;
      transform-origin: 8px 8px;
      transition: transform 0.6s cubic-bezier(0.65, 0, 0.35, 1);
    }

    #theme[data-mode="dark"] .half {
      transform: rotate(180deg);
    }

    @media (max-width: 560px) {
      .row {
        grid-template-columns: 1fr;
      }

      .years {
        order: -1;
        font-size: 13px;
      }
    }

    .print-note {
      display: none;
    }

    /* Print without the toggle, and point to the résumé. site.css makes it light. */
    @media print {
      .print-note {
        display: block;
        color: var(--muted);
      }

      :root:not(#print) [data-brand="linkedin"] {
        --b: #0a66c2;
      }

      #theme,
      #flashlight,
      .flashlight {
        display: none;
      }

      .aureo {
        filter: none;
      }
    }
  </style>
</head>
<body class="h-card">

  <data class="u-url u-uid" value="https://jefflouden.com/"></data>

  <button id="theme" type="button" hidden><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.25"/><path class="half" d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg></button>
  <main>
    <p class="print-note">The full résumé is at jefflouden.com/resume.pdf</p>
    <header>
      <h1 class="p-name">{{name}}</h1>
      <p class="role-line"><span class="p-job-title">{{job_title}}</span> at <span class="p-org">{{job_org}}</span></p>
    </header>

    <p class="intro p-note">{{bio}}</p>

    <section aria-labelledby="work">
      <h2 id="work">Work</h2>
      <ol class="rows">
        {{work}}
      </ol>
    </section>

    <section aria-labelledby="contact">
      <h2 id="contact">Contact</h2>

        <ul class="contact">
          <!--email_off--><li><a class="u-email" href="mailto:{{email}}" rel="me">{{email}}</a></li><!--/email_off-->
          {{contact}}
          <li><a href="resume.pdf" type="application/pdf">Résumé (PDF)</a></li>
          <li><a href="jeffrey-louden.vcf" type="text/vcard" download>Save contact</a></li>
        </ul>
      </address>
    </section>
  </main>

  {{> footer}}

  <script>
    // The light and dark toggle. It shows the current mode and is labelled with the next; a choice that matches
    // the system setting is forgotten so the system decides again.
    (function () {
      var button = document.getElementById('theme');
      var root = document.documentElement;
      var system = window.matchMedia('(prefers-color-scheme: dark)');
      function current() { return root.dataset.theme || (system.matches ? 'dark' : 'light'); }
      function label() {
        button.dataset.mode = current();
        button.setAttribute('aria-label', current() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
      }
      var still = window.matchMedia('(prefers-reduced-motion: reduce)');
      // Where the browser can, the page cross-fades between the two modes on the icon's timing.
      button.addEventListener('click', function () {
        if (document.startViewTransition && !still.matches) document.startViewTransition(toggle);
        else toggle();
      });
      function toggle() {
        var next = current() === 'dark' ? 'light' : 'dark';
        var saved = next === (system.matches ? 'dark' : 'light') ? null : next;
        if (saved) root.dataset.theme = saved; else delete root.dataset.theme;
        try { if (saved) localStorage.setItem('theme', saved); else localStorage.removeItem('theme'); } catch (e) {}
        label();
        bar(saved);
      }
      if (system.addEventListener) system.addEventListener('change', label);
      label();
      button.hidden = false;
    })();

    // The flashlight: a button beside the toggle, shown only in dark mode, turns it on and off and remembers the choice.
    // The light follows a mouse or pen.
    (function () {
      var light = document.querySelector('.flashlight');
      var button = document.getElementById('flashlight');
      var root = document.documentElement;
      function set(on) {
        if (on) root.dataset.flashlight = ''; else delete root.dataset.flashlight;
        button.setAttribute('aria-pressed', on ? 'true' : 'false');
      }
      try { set(localStorage.getItem('flashlight') === 'on'); } catch (e) {}
      button.addEventListener('click', function () {
        var on = !('flashlight' in root.dataset);
        set(on);
        try { if (on) localStorage.setItem('flashlight', 'on'); else localStorage.removeItem('flashlight'); } catch (e) {}
      });
      button.hidden = false;
      var still = window.matchMedia('(prefers-reduced-motion: reduce)');
      var frame = 0, x, y;
      document.addEventListener('pointermove', function (e) {
        if (e.pointerType === 'touch' || still.matches) return;
        x = e.clientX; y = e.clientY;
        if (!frame) frame = requestAnimationFrame(function () {
          frame = 0;
          light.style.setProperty('--x', x + 'px');
          light.style.setProperty('--y', y + 'px');
        });
      }, { passive: true });
      light.hidden = false;
    })();

    // Printing from the keyboard opens the résumé, the printable version of this page.
    // Printing from the browser's menu still prints the page, pointing to the résumé.
    document.addEventListener('keydown', function (e) {
      if ((e.metaKey || e.ctrlKey) && !e.altKey && !e.shiftKey && e.key.toLowerCase() === 'p') {
        e.preventDefault();
        window.open('resume.pdf', '_blank', 'noopener');
      }
    });
