  <style>
    /* Shared styles live in site.css. These are the home page's own. */
    /* Brand underlines: each organization's own color. */
    [data-brand="atlantic"] { --b: #e7131a; }
    [data-brand="existential"] { --b: #59c2cf; }
    [data-brand="time"] { --b: #e90606; }
    [data-brand="lyft"] { --b: #ff00bf; }
    [data-brand="nest"] { --b: #00afd8; }
    [data-brand="linkedin"] { --b: #0a66c2; }
    [data-brand="ink"] { --b: var(--ink); }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) [data-brand="linkedin"] { --b: #3480cc; }
    }

    :root[data-theme="dark"] [data-brand="linkedin"] { --b: #3480cc; }

    a[data-brand="google"] {
      text-decoration: none;
      padding-bottom: 3px;
      background: linear-gradient(90deg,
        color-mix(in srgb, #4285f4 var(--ua), transparent) 0 25%,
        color-mix(in srgb, #ea4335 var(--ua), transparent) 25% 50%,
        color-mix(in srgb, #fbbc05 var(--ua), transparent) 50% 75%,
        color-mix(in srgb, #34a853 var(--ua), transparent) 75%) no-repeat left bottom / 100% 1px;
    }

    .role-line {
      color: var(--muted);
    }

    h2 {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .rows {
      display: grid;
      gap: 32px;
    }

    .row {
      display: grid;
      grid-template-columns: 9.5rem 1fr;
      gap: 4px 24px;
      align-items: baseline;
    }

    .years {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .org {
      font-size: 16px;
      font-weight: 500;
    }

    .title {
      color: var(--muted);
    }

    .title + .title {
      margin-top: 2px;
    }

    /* Aureo lockup, recreated from aureo.audio: waveform mark plus the Outfit Bold wordmark as a path. */
    .built {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0 0.4em;
    }

    .aureo {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--ink);
      text-decoration: none;
      border-radius: 3px;
    }

    /* A soft shadow lifts the mark off the paper; on the dark ground it has nothing to do. */
    .aureo {
      filter: drop-shadow(0 1px 1.5px rgb(22 22 22 / 0.22));
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .aureo { filter: none; }
    }

    :root[data-theme="dark"] .aureo { filter: none; }

    .aureo-bars {
      width: 18px;
      height: 18px;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      overflow: visible;
    }

    .aureo-bars path:nth-child(1) { stroke: var(--aureo-1); }
    .aureo-bars path:nth-child(2),
    .aureo-bars path:nth-child(6) { stroke: var(--aureo-2); }
    .aureo-bars path:nth-child(3) { stroke: var(--aureo-3); }
    .aureo-bars path:nth-child(4) { stroke: var(--aureo-4); }
    .aureo-bars path:nth-child(5) { stroke: var(--aureo-5); }

    .aureo-word {
      height: 11px;
      width: auto;
      fill: currentColor;
    }

    .row ul li {
      line-height: 1.6;
    }

    address {
      font-style: normal;
    }

    .contact {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 28px;
    }

    /* The light and dark toggle, in the top-right corner of the page: an ink ring, half filled, that turns over between the modes.
       Without JavaScript it stays hidden. */
    #theme {
      position: absolute;
      top: clamp(16px, 2.5vw, 24px);
      right: clamp(16px, 2.5vw, 24px);
      display: inline-flex;
      background: none;
      border: 0;
      padding: 0;
      color: var(--ink);
      cursor: pointer;
      opacity: 0.8;
      transition: opacity 0.2s;
      z-index: 2;
      view-transition-name: theme-toggle;
    }

    /* In dark mode a button beside the toggle turns on a flashlight: a soft pool of light follows the pointer and the edges of
       the page fall into shadow. On touch screens and with reduced motion it stays put. It starts off, the choice is saved in
       localStorage (flashlight), and light mode, print and no-JS never see the button or the light. */
    .flashlight {
      --x: 50%;
      --y: 40%;
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(circle 340px at var(--x) var(--y), rgb(255 236 200 / 0.05) 0, rgb(0 0 0 / 0) 35%, rgb(0 0 0 / 0.18) 55%, rgb(0 0 0 / 0.42) 78%, rgb(0 0 0 / 0.6) 100%);
      opacity: 0;
      transition: opacity 0.6s;
    }

    .flashlight[hidden] {
      display: none;
    }

    #flashlight {
      position: absolute;
      top: clamp(16px, 2.5vw, 24px);
      right: calc(clamp(16px, 2.5vw, 24px) + 30px);
      display: none;
      background: none;
      border: 0;
      padding: 0;
      color: var(--ink);
      cursor: pointer;
      opacity: 0.8;
      transition: opacity 0.2s;
      z-index: 2;
    }

    #flashlight:hover,
    #flashlight:focus-visible {
      opacity: 1;
    }

    #flashlight:focus-visible {
      outline: 2px solid var(--blood);
      outline-offset: 3px;
      border-radius: 2px;
    }

    #flashlight svg {
      display: block;
      width: 14px;
      height: 14px;
    }

    #flashlight svg,
    #flashlight .lens {
      transition: fill 0.3s, filter 0.3s;
    }

    /* Turned on, the lens fills and a little warm light spills from it. */
    #flashlight::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: calc(100% - 1px);
      width: 24px;
      height: 14px;
      transform: translateX(-50%);
      background: radial-gradient(ellipse at 50% 100%, rgb(255 236 200 / 0.5), rgb(255 236 200 / 0) 70%);
      clip-path: polygon(32% 100%, 68% 100%, 100% 0, 0 0);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    #flashlight[aria-pressed="true"]::before {
      opacity: 1;
    }

    #flashlight[aria-pressed="true"] .lens {
      fill: currentColor;
    }

    #flashlight[aria-pressed="true"] svg {
      filter: drop-shadow(0 -1px 2px rgb(255 236 200 / 0.6));
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) #flashlight:not([hidden]) { display: inline-flex; }
      :root:not([data-theme="light"])[data-flashlight] .flashlight { opacity: 1; }
    }

    :root[data-theme="dark"] #flashlight:not([hidden]) { display: inline-flex; }
    :root[data-theme="dark"][data-flashlight] .flashlight { opacity: 1; }

    /* On a holiday, or in the run-up to the few that earn one, a small mark sits beside the toggle (and the flashlight in
       dark mode). The script below works the dates out from rules, so nothing needs touching each year. A few link out.
       On an Arsenal match day it is a gothic A instead. Without JavaScript, and in print, it stays hidden. */
    #holiday {
      position: absolute;
      top: calc(clamp(16px, 2.5vw, 24px) - 2px);
      right: calc(clamp(16px, 2.5vw, 24px) + 30px);
      display: inline-flex;
      color: var(--ink);
      opacity: 0.8;
      transition: opacity 0.2s;
      z-index: 2;
    }

    #holiday[hidden] {
      display: none;
    }

    a#holiday:hover,
    a#holiday:focus-visible {
      opacity: 1;
    }

    a#holiday:focus-visible {
      outline: 2px solid var(--blood);
      outline-offset: 3px;
      border-radius: 2px;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) #holiday { right: calc(clamp(16px, 2.5vw, 24px) + 60px); }
    }

    :root[data-theme="dark"] #holiday { right: calc(clamp(16px, 2.5vw, 24px) + 60px); }

    #holiday svg {
      display: block;
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #holiday .solid { fill: currentColor; stroke: none; }
    #holiday .accent { fill: var(--blood); stroke: none; }
    #holiday .accent-line { stroke: var(--blood); }
    #holiday .leaf-line { stroke: var(--aureo-1); }
    #holiday .sea-line { stroke: var(--aureo-4); }
    #holiday .knock { fill: var(--paper); }

    #theme[hidden] {
      display: none;
    }

    #theme:hover,
    #theme:focus-visible {
      opacity: 1;
    }

    #theme:focus-visible {
      outline: 2px solid var(--blood);
      outline-offset: 3px;
      border-radius: 50%;
    }

    /* Switching modes cross-fades the page on the icon's timing; the icon itself stays out of
       the fade and animates live on top. */
    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation-duration: 0.6s;
      animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1);
    }

    ::view-transition-old(theme-toggle) {
      display: none;
    }

    ::view-transition-new(theme-toggle) {
      animation: none;
    }

    #theme svg {
      display: block;
      width: 14px;
      height: 14px;
    }

    #theme .half {
      transform-box: view-box;
      transform-origin: 8px 8px;
      transition: transform 0.6s cubic-bezier(0.65, 0, 0.35, 1);
    }

    #theme[data-mode="dark"] .half {
      transform: rotate(180deg);
    }

    @media (max-width: 560px) {
      .row {
        grid-template-columns: 1fr;
      }

      .years {
        order: -1;
        font-size: 13px;
      }
    }

    .print-note {
      display: none;
    }

    /* Print without the toggle, and point to the résumé. site.css makes it light. */
    @media print {
      .print-note {
        display: block;
        color: var(--muted);
      }

      :root:not(#print) [data-brand="linkedin"] {
        --b: #0a66c2;
      }

      #theme,
      #flashlight,
      #holiday,
      .flashlight {
        display: none;
      }

      .aureo {
        filter: none;
      }
    }
  </style>
</head>

      function fixed(m, d) { return function (y) { return new Date(y, m - 1, d); }; }
      function nth(m, wd, n) { return function (y) { var first = new Date(y, m - 1, 1).getDay(); return new Date(y, m - 1, 1 + (wd - first + 7) % 7 + (n - 1) * 7); }; }

      // Election Day is the Tuesday after the first Monday in November: the first Tuesday from November 2.
      function election(y) { var d = new Date(y, 10, 2); return new Date(y, 10, 2 + (2 - d.getDay() + 7) % 7); }
      var marks = [
        { id: 'newyear', name: 'New Year’s Day', date: fixed(1, 1), lead: 1 },

      ];

      for (i = 0; i < marks.length && !hit; i++) {
        for (j = 0; j < 2 && !hit; j++) { // the second year catches New Year’s Eve
          d = marks[i].date(today.getFullYear() + j);
          until = Math.round((d - today) / 864e5);
          if (until >= 0 && until <= marks[i].lead) hit = marks[i];
        }
      }
      var game, k;
      for (i = 0; i < matches.length && !game; i++) {
        k = new Date(matches[i][0]);
        if (k.getFullYear() === today.getFullYear() && k.getMonth() === today.getMonth() && k.getDate() === today.getDate()) game = matches[i];

        };

      if (hit.cta) label += '. ' + hit.cta;
      mark.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + icon[hit.id] + '</svg>';
      mark.title = label;
      mark.setAttribute('aria-label', label);
      if (hit.url) { mark.href = hit.url; mark.rel = 'noopener'; } else { mark.setAttribute('role', 'img'); }
      mark.hidden = false;
