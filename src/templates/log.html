<!doctype html>
<!-- Built by build.py from src/. Edit there, not here. -->
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{name}}’s log</title>
  <meta name="description" content="Things {{name}} likes, and the odd note, newest first.">
  <link rel="canonical" href="https://jefflouden.com/log">
  <meta name="color-scheme" content="light dark">
  {{> theme}}
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="stylesheet" href="/site.css">
  <style>
    /* Shared styles live in site.css. These are this page's own. */
    /* A plain list, newest first. Dates are kept in the markup but not shown. */
    .log { display: grid; gap: 28px; }
    .log p { max-width: 56ch; text-wrap: pretty; }
    .log p + p { margin-top: 2px; }
    .what { font-weight: 500; }
    .what ~ p, .who ~ p { color: var(--muted); }
    /* Photos fill the column, with the same quiet corners everywhere. */
    .log img { display: block; width: 100%; max-width: 56ch; height: auto; margin: 10px 0 8px; border-radius: 3px; }
    /* A linked photo stays at full strength, unlike a text link, and keeps the focus ring. */
    .log a.photo { display: block; max-width: 56ch; margin: 10px 0 8px; opacity: 1; border-radius: 3px; }
    .log a.photo img { margin: 0; }
    /* Where, when Jeff says, under everything else: a small label like the home page's section headings. */
    .log .place { color: var(--muted); font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; margin-top: 8px; }
    /* Quotes are set in the intro's serif, with who said it underneath. */
    blockquote { margin: 0; font-family: var(--serif); font-size: 19px; line-height: 1.4; letter-spacing: -0.005em; }
    .who { color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <main>
    {{> header}}
    <h1 class="intro">Log</h1>
    <ol class="log" reversed>
      <!-- Entries come from src/log.json. Add one there and run build.py. -->
      {{entries}}
    </ol>
  </main>
  {{> footer}}
</body>
</html>
