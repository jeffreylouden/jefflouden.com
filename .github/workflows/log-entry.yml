# Publishes a "Log entry" issue: adds it to src/log.json (with its photo
# prepared into public/images/log/), rebuilds, tests, pushes to main, posts
# it to Bluesky (when the BLUESKY_APP_PASSWORD secret is set), and closes the
# issue. Only open issues Jeff opens from that form (its body starts with the
# Kind field) run it. On a problem it comments with what to fix, and editing
# the issue runs it again.
name: Log entry
on:
  issues:
    types: [opened, edited]
permissions:
  contents: write
  issues: write
concurrency:
  group: log-entry
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ github.token }}
  ISSUE: ${{ github.event.issue.number }}
jobs:
  # An edit can queue a run behind one that already published this issue,
  # so look at the issue as it is now, not as the event saw it.
  gate:
    if: >-
      github.event.issue.state == 'open' &&
      github.event.issue.author_association == 'OWNER' &&
      startsWith(github.event.issue.body, '### Kind')
    runs-on: ubuntu-latest
    outputs:
      state: ${{ steps.issue.outputs.state }}
    steps:
      - id: issue
        run: echo "state=$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json state --jq .state)" >> "$GITHUB_OUTPUT"
  add:
    needs: gate
    if: needs.gate.outputs.state == 'OPEN'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install pillow
      # The body goes in through the environment, never into the script itself.
      - id: entry
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python3 scripts/log_entry.py 2> error.txt
      - run: python3 build.py 2> error.txt
      - run: python3 -m unittest discover tests 2> error.txt && node --test tests/middleware.test.mjs > error.txt 2>&1
      - env:
          MESSAGE: ${{ steps.entry.outputs.message }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/log.json public
          git commit -m "$MESSAGE" -m "From #$ISSUE."
          git push origin HEAD:main
      # The entry is live by now, so a Bluesky problem is reported, never fatal.
      - id: bluesky
        continue-on-error: true
        env:
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: python3 scripts/bluesky_post.py --before HEAD~1 --after HEAD 2> bluesky-error.txt
      - env:
          POSTS: ${{ steps.bluesky.outputs.posts }}
          BLUESKY: ${{ steps.bluesky.outcome }}
        run: |
          {
            echo "On the log: https://jefflouden.com/log ($(git rev-parse --short HEAD))"
            if [ -n "$POSTS" ]; then echo; echo "On Bluesky: $POSTS"; fi
            if [ "$BLUESKY" = failure ]; then
              echo; echo "It didn't go out on Bluesky:"; echo; echo '```'; tail -n 5 bluesky-error.txt; echo '```'
            fi
          } > closing.md
          gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" --comment "$(cat closing.md)"
      - if: failure()
        run: |
          {
            echo "That didn't make it onto the log. Edit this issue to try again."
            echo
            echo '```'
            tail -n 20 error.txt 2>/dev/null
            echo '```'
            echo
            echo "The run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > comment.md
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file comment.md
